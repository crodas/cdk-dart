[package]
name = "cdk-ffi-dart"
edition = "2021"
rust-version = "1.85.0"
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/cashubtc/cdk"
repository = "https://github.com/cashubtc/cdk.git"
version = "0.18.0"
readme = "README.md"

[lib]
crate-type = ["staticlib", "cdylib"]
name = "cdk_ffi_dart"

[[bin]]
name = "uniffi-bindgen-dart"
path = "uniffi-bindgen.rs"

[dependencies]
cdk-ffi = { git = "https://github.com/crodas/cdk", rev = "9f188e135c84034c7c7b9151884fa4066cdfcd53", default-features = false, features = ["npubcash", "nwc", "bip353"] }
uniffi = { version = "0.30", features = ["cli"] }
uniffi-dart = { git = "https://github.com/Uniffi-Dart/uniffi-dart", rev = "e3ed67f780257a5a7fae23231e13d84f931208e0" }
camino = "1.2"

[build-dependencies]
uniffi = { version = "0.30", features = ["build"] }
uniffi-dart = { git = "https://github.com/Uniffi-Dart/uniffi-dart", features = ["build"], rev = "e3ed67f780257a5a7fae23231e13d84f931208e0" }

[lints]


[workspace]

[profile.release]
lto = true
strip = true
codegen-units = 1
